databases:
  - name: icp-finder-db
    # Upgraded from free to Starter:
    #   • Free-tier PostgreSQL expires after 90 days — data loss risk in production
    #   • Starter provides persistent storage with daily backups
    plan: starter
    region: oregon
    databaseName: icp_finder
    user: icp_user
    postgresMajorVersion: "16"

services:
  # ── Web API ──────────────────────────────────────────────────────────────────
  - type: web
    name: icp-finder-api
    runtime: python
    # Upgraded from free to Starter:
    #   • Free tier sleeps after 15 min of inactivity — breaks webhook reliability
    #   • Starter provides always-on instances required for SendGrid webhooks
    plan: starter
    region: oregon
    buildCommand: ./scripts/build.sh
    startCommand: ./scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icp-finder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: icp-finder-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://n4cluster.com,https://www.n4cluster.com"
      - key: DASHBOARD_USERNAME
        value: "admin"
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: YELP_FUSION_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      # ── JWT / OAuth2 (NIF-254) ───────────────────────────────────────────────
      # JWT_SECRET_KEY must be set manually in Render dashboard (sync: false).
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # ── SendGrid — Lead Communication Tracking Phase 1 ──────────────────────
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_FROM_NAME
        value: "N4Cluster"
      - key: SENDGRID_WEBHOOK_SIGNING_KEY
        sync: false
      # ── Email tracking pixel / click redirect ───────────────────────────────
      # Render gives every service a deterministic <name>.onrender.com URL, so we
      # can hardcode this rather than relying on a manual post-deploy step.
      # If you put a custom domain in front of the web service, update this value.
      - key: TRACKING_BASE_URL
        value: https://icp-finder-api.onrender.com
      - key: TRACKING_FALLBACK_URL
        sync: false

  # ── Celery Worker ────────────────────────────────────────────────────────────
  # Runs all task queues: crawl, extract, score, cleanup, tracking, email
  - type: worker
    name: icp-finder-worker
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./scripts/build.sh
    startCommand: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=4
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icp-finder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: icp-finder-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # SECRET_KEY must match the web service's generated value, otherwise any
      # token/cookie/URL signed by the worker will fail verification in the API
      # (and vice versa). `fromService` pulls the live value at deploy time.
      - key: SECRET_KEY
        fromService:
          name: icp-finder-api
          type: web
          envVarKey: SECRET_KEY
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: YELP_FUSION_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      # SendGrid (worker sends emails and processes webhook events)
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_FROM_NAME
        value: "N4Cluster"
      # Tracking (worker embeds tracking URLs in outgoing email HTML).
      # Must match the web service's TRACKING_BASE_URL exactly — both services
      # generate/serve the same URLs.
      - key: TRACKING_BASE_URL
        value: https://icp-finder-api.onrender.com
      - key: TRACKING_FALLBACK_URL
        sync: false

  # ── Celery Beat (scheduler) ──────────────────────────────────────────────────
  # Dispatches scheduled tasks:
  #   • Daily incremental crawl — 2 AM UTC
  #   • Weekly full rescore     — Sunday 4 AM UTC
  #   • Daily cleanup           — 3 AM UTC
  - type: worker
    name: icp-finder-beat
    runtime: python
    # NOTE: free plan workers have a monthly hour cap and can be paused. A paused
    # beat silently stops dispatching scheduled tasks (daily crawl, weekly rescore,
    # daily cleanup). Upgrade to starter if scheduler reliability matters.
    plan: free
    region: oregon
    buildCommand: ./scripts/build.sh
    startCommand: celery -A src.tasks.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    envVars:
      # Beat doesn't query the DB itself, but importing src.tasks.celery_app
      # transitively loads task modules that construct the SQLAlchemy engine at
      # import time. Without DATABASE_URL the engine binds to the localhost
      # default, masking config issues. Inject it for consistency.
      - key: DATABASE_URL
        fromDatabase:
          name: icp-finder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: icp-finder-redis
          type: redis
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PYTHONPATH
        value: /opt/render/project/src

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: icp-finder-redis
    # Upgraded from free to Starter:
    #   • Free tier uses allkeys-lru eviction — rate-limit sorted sets can be
    #     silently dropped under memory pressure, making fail-open the default
    #     rather than the exception (NIF-255)
    #   • Starter provides dedicated memory and persistence
    plan: starter
    region: oregon
    # noeviction: writes fail loudly when memory is full instead of silently
    # dropping rate-limit state (NIF-255). The Starter memory budget should be
    # enough that this rarely fires; if it does, that's a signal to investigate
    # leaking keys rather than mask it with LRU eviction.
    maxmemoryPolicy: noeviction
    ipAllowList: []
